name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh firmware.sh build-image.sh test.sh backends/*.sh
      - run: python3 -m py_compile test-qemu.py
  qemu-smoke:
    # Alpine + sway, LUKS: build the image, install, boot, check (about 20 min).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: mkdir -p out && sh build-image.sh out
      - run: sh test.sh out alpine sway encrypt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log
          path: out/*.log
